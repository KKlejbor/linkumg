version: "3.8"

networks:
  server:
  client:

services:
  server:
    command: tail -f /dev/null
    container_name: linkumg_server
    image: maven:3.8.5-openjdk-17
    tty: true
    volumes:
      - ./server:/app
    stdin_open: true
    ports:
      - 8080:8080
    networks:
      - server

  client:
    command: "yarn start"
    container_name: linkumg_client
    build:
      context: client
      dockerfile: Dockerfile.dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 3000:3000
    volumes:
      - ./client:/home/node/ui
      - /home/node/ui/node_modules
    networks:
      - client
