version: "3.8"

networks:
  api:
  postgres:

services:
  server:
    container_name: linkumg_server
    build:
      context: server
      dockerfile: Dockerfile.prod
    volumes:
      - ./server:/app
      - ./images:/images
    networks:
      - api
      - postgres

  db:
    image: postgres
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
      POSTGRES_DB: linkumg
    volumes:
      - ./postgres:/data/postgres
    networks:
      - postgres
    restart: unless-stopped

  client-prod:
    container_name: linkumg_client
    build:
      context: client
      dockerfile: Dockerfile.prod
    ports:
      - 4173:80
    networks:
      - api
